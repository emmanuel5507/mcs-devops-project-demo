#CI FOR PRODUCT CATALOG

name: product-catalog-ci

on:
 push:
    branches:
        - main
        
permissions:
  contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Setup Go 1.22
          uses: actions/setup-go@v2 
          with:
            go-version: 1.22

        - name: Build
          run: |
            cd src/product-catalog
            go mod download
            go build -o product-catalog-service /src/product-catalog/main.go

        - name: unit tests
          run: go test /src/product-catalog/...

    code-quality:
        runs-on: ubuntu-Latest
        steps: 
        - name: checkout code
          uses: actions/checkout@v4
 
        - name: Run golangci-lint
          run: |
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.55.2
            golangci-lint run src/product-catalog/...
    
    docker:
        runs-on: ubuntu-latest
        needs: build
        steps:
        - name: checkout code
          uses: actions/checkout@v4
        
        - name: Install Docker
          uses: docker/setup-buildx-action@v2

        - name: Login to DockerHub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}
        
        - name: Build and Push Docker Image
          uses: docker/build-push-action@v4
          with:
            context: ./src/product-catalog
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}   
    
    updatek8s:
        runs-on: ubuntu-latest
        needs: docker
        steps:
        - name: checkout code
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.GITHUB_TOKEN }}

        - name: Update Kubernetes Deployment Manifest
          run: |
            sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}|" kubernetes/productcatalog/deploy.yaml

        - name: Commit and Push Changes
          run: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add kubernetes/productcatalog/deploy.yaml
            git commit -m "[CI]-Update product-catalog image to ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}"
            git push origin main`